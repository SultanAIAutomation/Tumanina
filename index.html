<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>تطبيق الأذكار - طمأنينة</title>
    <!-- خط Tajawal الأنيق -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #0f172a;
            --card-bg: #f8fafc;
            --card-border: #e2e8f0;
            --subtext: #64748b;
            --accent: #10b981;
            --accent-bg: rgba(16, 185, 129, 0.12);
            --icon-bg: rgba(16, 185, 129, 0.12);
        }

        /* الوضع الليلي الملكي: خلفية سوداء وبطاقات كحلية داكنة فاخرة */
        html.dark {
            --bg-color: #000000;
            --text-color: #ffffff;
            --card-bg: #111625;
            --card-border: rgba(255, 255, 255, 0.08);
            --subtext: #94a3b8;
            --accent: #10b981;
            --accent-bg: rgba(16, 185, 129, 0.18);
            --icon-bg: rgba(16, 185, 129, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 16px 16px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        nav {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 19px;
        }

        .logo-icon-box {
            padding: 8px;
            background-color: var(--icon-bg);
            color: var(--accent);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: inherit;
            padding: 8px 12px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-title {
            text-align: center;
            margin-bottom: 24px;
        }

        .header-title h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.3px;
        }

        .header-title p {
            font-size: 13px;
            color: var(--subtext);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 18px 20px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:active {
            transform: scale(0.98);
        }

        .card-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .card-icon {
            width: 48px;
            height: 48px;
            background-color: var(--icon-bg);
            color: var(--accent);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
        }

        .card-desc {
            font-size: 12px;
            color: var(--subtext);
            margin-top: 4px;
            direction: rtl;
        }

        .card-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-action {
            background-color: var(--accent-bg);
            color: var(--accent);
            border: none;
            padding: 9px 18px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .progress-ring-svg {
            width: 32px;
            height: 32px;
            transform: rotate(-90deg);
        }

        .progress-ring-circle-bg {
            stroke: var(--card-border);
            stroke-width: 3;
            fill: transparent;
        }

        .progress-ring-circle {
            stroke: var(--accent);
            stroke-width: 3;
            stroke-linecap: round;
            fill: transparent;
            transition: stroke-dashoffset 0.35s ease;
        }

        .hidden { display: none !important; }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .btn-back {
            background: none;
            border: none;
            color: var(--subtext);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .progress-text {
            font-size: 12px;
            background: var(--card-border);
            padding: 4px 12px;
            border-radius: 20px;
            color: var(--subtext);
            font-weight: 500;
        }

        .btn-reset-section {
            background: rgba(220, 38, 38, 0.15);
            color: #ef4444;
            border: none;
            padding: 6px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: var(--card-border);
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s ease;
        }

        .zikr-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 24px;
            min-height: 340px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        }

        .zikr-text {
            font-size: 19px;
            line-height: 1.8;
            font-weight: 500;
            white-space: pre-line;
        }

        .zikr-benefit {
            font-size: 12px;
            color: var(--accent);
            background: var(--accent-bg);
            padding: 12px;
            border-radius: 14px;
            text-align: right;
            margin-top: 14px;
            line-height: 1.6;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--card-border);
            gap: 8px;
        }

        .counter-btn {
            background-color: var(--accent);
            color: #ffffff;
            border: none;
            padding: 14px 22px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            min-width: 135px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            order: 1;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .next-btn {
            background-color: var(--card-border);
            color: var(--text-color);
            border: none;
            padding: 14px 16px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            order: 2;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .reset-item-btn {
            background-color: var(--card-border);
            color: var(--subtext);
            border: none;
            padding: 14px;
            border-radius: 16px;
            cursor: pointer;
            order: 3;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .modal-overlay {
            position: fixed;
            top:0; left:0; right:0; bottom:0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 100;
        }

        .modal-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 24px;
            border-radius: 20px;
            max-width: 320px;
            width: 100%;
            text-align: center;
        }

        .modal-btns {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .btn-confirm { flex: 1; padding: 11px; background: #dc2626; color: #fff; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .btn-cancel { flex: 1; padding: 11px; background: var(--card-border); color: var(--text-color); border: none; border-radius: 12px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <nav>
            <div class="logo">
                <div class="logo-icon-box">
                    <svg class="icon-svg" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
                </div>
                <span>طمأنينة</span>
            </div>
            <button class="theme-btn" onclick="toggleTheme()" id="theme-btn">
                <svg class="icon-svg" id="theme-icon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
            </button>
        </nav>

        <div id="dashboard-view">
            <div class="header-title">
                <h1>أذكارك اليومية</h1>
                <p>حافظ على أذكارك لتنعم بالطمأنينة والهدوء</p>
            </div>

            <div id="sections-grid"></div>
        </div>

        <div id="zikr-view" class="hidden">
            <div class="top-bar">
                <button class="btn-back" onclick="showDashboard()">
                    <svg class="icon-svg" style="width: 16px; height: 16px;" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
                    الرئيسية
                </button>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <span class="progress-text" id="progress-text">0 / 0 ذكر</span>
                    <button class="btn-reset-section" onclick="triggerResetSection()">
                        <svg class="icon-svg" style="width: 14px; height: 14px;" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                        تصفير
                    </button>
                </div>
            </div>

            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-bar"></div>
            </div>

            <div class="zikr-card">
                <div>
                    <p class="zikr-text" id="zikr-text"></p>
                    <div class="zikr-benefit hidden" id="zikr-benefit"></div>
                </div>

                <div class="controls">
                    <button class="counter-btn" onclick="incrementCounter()" id="counter-btn">
                        <span id="counter-current">0</span> / <span id="counter-target" style="opacity: 0.7; font-size: 14px;">0</span>
                    </button>

                    <button class="next-btn" onclick="nextZikrManual()">
                        <span>التالي</span>
                        <svg class="icon-svg" style="width: 16px; height: 16px;" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
                    </button>

                    <button class="reset-item-btn" onclick="resetCurrentCount()" title="تصفير العداد للذكر">
                        <svg class="icon-svg" style="width: 18px; height: 18px;" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                    </button>
                </div>
            </div>
        </div>

        <div id="completion-view" class="hidden" style="text-align: center; padding-top: 40px;">
            <div class="logo-icon-box" style="width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 50%;">
                <svg class="icon-svg" style="width: 32px; height: 32px;" viewBox="0 0 24 24"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
            </div>
            <h2 style="font-size: 22px; font-weight: bold; margin-bottom: 8px;">🌿 بارك الله فيك</h2>
            <p style="font-size: 14px; color: var(--subtext); margin-bottom: 24px;">أتممت أذكار هذا القسم بالكامل.</p>
            <button class="btn-action" onclick="showDashboard()" style="padding: 12px 28px; font-size: 14px;">
                العودة للرئيسية
            </button>
        </div>
    </div>

    <div class="modal-overlay hidden" id="reset-modal">
        <div class="modal-box">
            <h3 style="font-size: 18px; font-weight: bold; margin-bottom: 8px;">تصفير القسم؟</h3>
            <p style="font-size: 13px; color: var(--subtext);">هل أنت متأكد من رغبتك في إعادة ضبط هذا القسم بالكامل؟</p>
            <div class="modal-btns">
                <button class="btn-confirm" onclick="confirmResetSection()">نعم، تصفير</button>
                <button class="btn-cancel" onclick="closeResetModal()">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        function safeGetStorage(key, defaultValue) {
            try {
                var v = localStorage.getItem(key);
                return v ? JSON.parse(v) : defaultValue;
            } catch (e) { return defaultValue; }
        }
        function safeSetStorage(key, value) {
            try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
        }

        var iconsMap = {
            sun: '<svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>',
            moon: '<svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>',
            prayer: '<svg class="icon-svg" viewBox="0 0 24 24"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>',
            treasures: '<svg class="icon-svg" viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>'
        };

        var azkarData = [
            {
                id: "morning", title: "أذكار الصباح", iconKey: "sun",
                items: [
                    { id: "m1", text: "أَعُوذُ بِاللهِ مِنْ الشَّيْطَانِ الرَّجِيمِ\nاللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ وَلَا يَئُودُهُ حِفْظُهُمَا وَهُوَ الْعَلِيُّ الْعَظِيمُ. [آية الكرسي - البقرة 255]", benefit: "من قالها حين يصبح أجير من الجن حتى يمسى ومن قالها حين يمسى أجير من الجن حتى يصبح.", count: 1 },
                    { id: "m2", text: "بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيمِ\nقُلْ هُوَ اللَّهُ أَحَدٌ ، اللَّهُ الصَّمَدُ ، لَمْ يَلِدْ وَلَمْ يُولَدْ ، وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ.", benefit: "من قالها حين يصبح وحين يمسى كفته من كل شيء (الإخلاص والمعوذتين).", count: 3 },
                    { id: "m3", text: "بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيمِ\nقُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ، مِنْ شَرِّ مَا خَلَقَ ، وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ ، وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ، وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ.", count: 3 },
                    { id: "m4", text: "بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيمِ\nقُلْ أَعُوذُ بِرَبِّ النَّاسِ ، مَلِكِ النَّاسِ ، إِلَهِ النَّاسِ ، مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ، الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ، مِنَ الْجِنَّةِ وَالنَّاسِ.", count: 3 },
                    { id: "m5", text: "أَصْبَحْنَا وَأَصْبَحَ المُلْكُ للهِ وَالحَمْدُ للهِ ، لا إلهَ إلاّ اللّهُ وَحْدَهُ لا شَرِيكَ لهُ، لهُ المُلْكُ ولهُ الحَمْدُ، وهُوَ على كلّ شَيءٍ قدير ، رَبِّ أسْأَلُكَ خَيْرَ ما في هذا اليوم وَخَيْرَ ما بَعْدَه ، وَأَعُوذُ بِكَ مِنْ شَرِّ ما في هذا اليوم وَشَرِّ ما بَعْدَه، رَبِّ أَعُوذُ بِكَ مِنَ الكَسَلِ وَسُوءِ الكِبَر ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ في النَّارِ وَعَذَابٍ في القَبْر.", count: 1 },
                    { id: "m6", text: "اللّهُمَّ أَنْتَ رَبِّي لا إلهَ إلاّ أَنْتَ ، خَلَقْتَنِي وَأَنَا عَبْدُك ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ ما اسْتَطَعْت ، أَعُوذُ بِكَ مِنْ شَرِّ ما صَنَعْت ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لا يَغْفِرُ الذُّنُوبَ إِلاّ أَنْتَ .", benefit: "سيد الاستغفار: من قالها موقناً بها حين يمسى ومات من ليلته دخل الجنة وكذلك حين يصبح.", count: 1 },
                    { id: "m7", text: "رَضِيتُ بِاللهِ رَبَّاً وَبِالإسْلامِ دِيناً وَبِمُحَمَّدٍ صلى الله عليه وسلم نَبِيَّاً.", benefit: "من قالها حين يصبح وحين يمسى كان حقاً على الله أن يرضيه يوم القيامة.", count: 3 },
                    { id: "m8", text: "اللّهُمَّ إِنِّي أَصْبَحْتُ أُشْهِدُك ، وَأُشْهِدُ حَمَلَةَ عَرْشِك ، وَمَلائِكَتَكَ ، وَجَمِيعَ خَلْقِك ، أَنَّكَ أَنْتَ اللهُ لا إلهَ إلاّ أَنْتَ وَحْدَكَ لا شَرِيكَ لَك ، وَأَنَّ مُحَمَّداً عَبْدُكَ وَرَسُولُك.", benefit: "من قالها أعتقه الله من النار.", count: 4 },
                    { id: "m9", text: "اللّهُمَّ ما أَصْبَحَ بي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِك ، فَمِنْكَ وَحْدَكَ لا شريكَ لَك ، فَلَكَ الحَمْدُ وَلَكَ الشُّكْر.", benefit: "من قالها حين يصبح أدى شكر يومه.", count: 1 },

                    { id: "m11", text: "بِسْمِ اللهِ الذي لا يَضُـرُّ مَعَ اسمِهِ شَيءٌ في الأرْضِ وَلا في السَّماءِ وَهُوَ السَّمِيعُ العَلِيمُ.", benefit: "لم يضره من الله شيء.", count: 3 },
                    { id: "m12", text: "اللّهُمَّ بِكَ أَصْبَحْنَا وَبِكَ أَمْسَيْنَا ، وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ النُّشُورُ.", count: 1 },
                    { id: "m13", text: "أَصْبَحْنَا عَلَى فِطْرَةِ الإسْلاَمِ، وَعَلَى كَلِمَةِ الإِخْلاَصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ، وَعَلَى مِلَّةِ أَبِينَا إبْرَاهِيمَ حَنِيفاً مُسْلِماً وَمَا كَانَ مِنَ المُشْرِكِينَ.", count: 1 },
                    { id: "m14", text: "سُبْحَانَ اللهِ وَبِحَمْدِهِ عَدَدَ خَلْقِهِ ، وَرِضَا نَفْسِهِ ، وَزِنَةَ عَرْشِهِ ، وَمِدَادَ كَلِمَاتِهِ.", count: 3 },
                    { id: "m15", text: "اللّهُمَّ عَافِنِي في بَدَنِي ، اللّهُمَّ عَافِنِي في سَمْعِي ، اللّهُمَّ عَافِنِي في بَصَرِي ، لا إلهَ إلاّ أَنْتَ.", count: 3 },
                    { id: "m16", text: "اللّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الكُفْرِ ، وَالفَقْرِ ، وَأَعُوذُ بِكَ مِنْ عَذَابِ القَبْرِ ، لا إلهَ إلاّ أَنْتَ.", count: 3 },
                    { id: "m17", text: "اللّهُمَّ إِنِّي أسْأَلُكَ العَفْوَ وَالعَافِيَةَ في الدُّنْيَا وَالآخِرَةِ ، اللّهُمَّ إِنِّي أسْأَلُكَ العَفْوَ وَالعَافِيَةَ في دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي ، اللّهُمَّ اسْتُرْ عَوْرَاتِي وَآمِنْ رَوْعَاتِي ، اللّهُمَّ احْفَظْنِي مِن بَيْنِ يَدَيَّ وَمِن خَلْفِي وَعَن يَمِينِي وَعَن شِمَالِي ، وَمِن فَوْقِي ، وَأَعُوذُ بِعَظَمَتِكَ أَن أُغْتَالَ مِن تَحْتِي.", count: 1 },
                    { id: "m18", text: "يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أسْتَغِيثُ أَصْلِحْ لِي شَأْنِي كُلَّهُ وَلاَ تَكِلْنِي إلَى نَفْسِي طَرْفَةَ عَيْنٍ.", count: 3 },

                    { id: "m20", text: "اللّهُمَّ عَالِمَ الغَيْبِ وَالشَّهَادَةِ فَاطِرَ السَّمَاوَاتِ وَالأرْضِ رَبَّ كلِّ شَيءٍ وَمَلِيكَه ، أَشْهَدُ أَنْ لا إِلَهَ إِلاّ أَنْت ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءاً أَوْ أَجُرَّهُ إِلَى مُسْلِم.", count: 1 },

                    { id: "m22", text: "اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ على نَبِيِّنَا مُحمَّد.", benefit: "من صلى علي حين يصبح وحين يمسى أدركته شفاعتي يوم القيامة.", count: 10 },
                    { id: "m23", text: "اللَّهُمَّ إِنَّا نَعُوذُ بِكَ مِنْ أَنْ نُشْرِكَ بِكَ شَيْئًا نَعْلَمُهُ ، وَنَسْتَغْفِرُكَ لِمَا لَا نَعْلَمُهُ.", count: 3 },
                    { id: "m24", text: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ الهَمِّ وَالحَزَنِ، وَأَعُوذُ بِكَ مِنْ العَجْزِ وَالكَسَلِ، وَأَعُوذُ بِكَ مِنْ الجُبْنِ وَالبُخْلِ، وَأَعُوذُ بِكَ مِنْ غَلَبَةِ الدَّيْنِ، وَقَهْرِ الرِّجَالِ.", count: 3 },

                    { id: "m27", text: "اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلًا مُتَقَبَّلًا.", count: 1 },

                    { id: "e6", text: "أَمْسَيْنَا وَأَمْسَى المُلْكُ للهِ وَالحَمْدُ للهِ ، لا إلهَ إلاّ اللّهُ وَحْدَهُ لا شَرِيكَ لهُ، لهُ المُلْكُ ولهُ الحَمْدُ، وهُوَ على كلّ شَيءٍ قدير ، رَبِّ أسْأَلُكَ خَيْرَ ما في هذهِ اللَّيْلَةِ وَخَيْرَ ما بَعْدَها ، وَأَعُوذُ بِكَ مِنْ شَرِّ ما في هذهِ اللَّيْلَةِ وَشَرِّ ما بَعْدَها ، رَبِّ أَعُوذُ بِكَ مِنَ الكَسَلِ وَسُوءِ الكِبَر ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ في النَّارِ وَعَذَابٍ في القَبْر.", count: 1 },

                    { id: "e12", text: "بِسْمِ اللهِ الذي لا يَضُـرُّ مَعَ اسمِهِ شَيءٌ في الأرْضِ وَلا في السَّماءِ وَهُوَ السَّمِيعُ العَلِيمُ.", count: 3 },
                    { id: "e13", text: "اللّهُمَّ بِكَ أَمْسَيْنَا وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ المَصِيرُ.", count: 1 },
                    { id: "e14", text: "أَمْسَيْنَا عَلَى فِطْرَةِ الإسْلاَمِ، وَعَلَى كَلِمَةِ الإِخْلاَصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ، وَعَلَى مِلَّةِ أَبِينَا إبْرَاهِيمَ حَنِيفاً مُسْلِماً وَمَا كَانَ مِنَ المُشْرِكِينَ.", count: 1 },
                    { id: "e15", text: "سُبْحَانَ اللهِ وَبِحَمْدِهِ عَدَدَ خَلْقِهِ ، وَرِضَا نَفْسِهِ ، وَزِنَةَ عَرْشِهِ ، وَمِدَادَ كَلِمَاتِهِ.", count: 3 },
                    { id: "e16", text: "اللّهُمَّ عَافِنِي في بَدَنِي ، اللّهُمَّ عَافِنِي في سَمْعِي ، اللّهُمَّ عَافِنِي في بَصَرِي ، لا إلهَ إلاّ أَنْتَ.", count: 3 },
                    { id: "e17", text: "اللّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الكُفْرِ ، وَالفَقْرِ ، وَأَعُوذُ بِكَ مِنْ عَذَابِ القَبْرِ ، لا إلهَ إلاّ أَنْتَ.", count: 3 },
                    { id: "e18", text: "اللّهُمَّ إِنِّي أسْأَلُكَ العَفْوَ وَالعَافِيَةَ في الدُّنْيَا وَالآخِرَةِ ، اللّهُمَّ إِنِّي أسْأَلُكَ العَفْوَ وَالعَافِيَةَ في دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي ، اللّهُمَّ اسْتُرْ عَوْرَاتِي وَآمِنْ رَوْعَاتِي ، اللّهُمَّ احْفَظْنِي مِن بَيْنِ يَدَيَّ وَمِن خَلْفِي وَعَن يَمِينِي وَعَن شِمَالِي ، وَمِن فَوْقِي ، وَأَعُوذُ بِعَظَمَتِكَ أَن أُغْتَالَ مِن تَحْتِي.", count: 1 },
                    { id: "e19", text: "يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أسْتَغِيثُ أَصْلِحْ لِي شَأْنِي كُلَّهُ وَلاَ تَكِلْنِي إلَى نَفْسِي طَرْفَةَ عَيْنٍ.", count: 3 },
                    { id: "e20", text: "أَمْسَيْنَا وَأَمْسَى المُلْكُ للهِ رَبِّ العَالَمِينَ، اللَّهُمَّ إِنَّي أسْأَلُكَ خَيْرَ هَذِهِ اللَّيْلَةِ فَتْحَهَا ونَصْرَهَا، ونُورَهَا وبَرَكَتَهَا، وَهُدَاهَا، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِيهَا وَشَرِّ مَا بَعْدَهَا.", count: 1 },
                    { id: "e21", text: "اللّهُمَّ عَالِمَ الغَيْبِ وَالشَّهَادَةِ فَاطِرَ السَّمَاوَاتِ وَالأرْضِ رَبَّ كلِّ شَيءٍ وَمَلِيكَه ، أَشْهَدُ أَنْ لا إِلَهَ إِلاّ أَنْت ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءاً أَوْ أَجُرَّهُ إِلَى مُسْلِم.", count: 1 },
                    { id: "e22", text: "أَعُوذُ بِكَلِمَاتِ اللّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ.", count: 3 },
                    { id: "e23", text: "اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ على نَبِيِّنَا مُحمَّد.", count: 10 },
                    { id: "e24", text: "اللَّهُمَّ إِنَّا نَعُوذُ بِكَ مِنْ أَنْ نُشْرِكَ بِكَ شَيْئًا نَعْلَمُهُ ، وَنَسْتَغْفِرُكَ لِمَا لَا نَعْلَمُهُ.", count: 3 },
                    { id: "e25", text: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ الهَمِّ وَالحَزَنِ، وَأَعُوذُ بِكَ مِنْ العَجْزِ وَالكَسَلِ، وَأَعُوذُ بِكَ مِنْ الجُبْنِ وَالبُخْلِ، وَأَعُوذُ بِكَ مِنْ غَلَبَةِ الدَّيْنِ، وَقَهْرِ الرِّجَالِ.", count: 3 },
                    { id: "e26", text: "أسْتَغْفِرُ اللهَ العَظِيمَ الَّذِي لاَ إلَهَ إلاَّ هُوَ، الحَيُّ القَيُّومُ، وَأتُوبُ إلَيهِ.", count: 3 },
                    { id: "e27", text: "يَا رَبِّ , لَكَ الحَمْدُ كَمَا يَنْبَغِي لِجَلاَلِ وَجْهِكَ , وَلِعَظِيمِ سُلْطَانِكَ.", count: 3 },
                    { id: "e28", text: "لَا إلَه إلّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ المُلْكُ وَلَهُ الحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءِ قَدِيرِ.", count: 100 },
                    { id: "e29", text: "اللَّهُمَّ أَنْتَ رَبِّي لا إِلَهَ إِلا أَنْتَ ، عَلَيْكَ تَوَكَّلْتُ ، وَأَنْتَ رَبُّ العَرْشِ العَظِيمِ , مَا شَاءَ اللَّهُ كَانَ ، وَمَا لَمْ يَشَأْ لَمْ يَكُنْ ، وَلا حَوْلَ وَلا قُوَّةَ إِلا بِاللَّهِ العَلِيِّ العَظِيمِ , أَعْلَمُ أَنَّ اللَّهَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ ، وَأَنَّ اللَّهَ قَدْ أَحَاطَ بِكُلِّ شَيْءٍ عِلْمًا , اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي ، وَمِنْ شَرِّ كُلِّ دَابَّةٍ أَنْتَ آخِذٌ بِنَاصِيَتِهَا ، إِنَّ رَبِّي عَلَى صِرَاطٍ مُسْتَقِيمٍ.", count: 1 },
                    { id: "e30", text: "سُبْحَانَ اللهِ وَبِحَمْدِهِ.", count: 100 }
                ]
            },
            {
                id: "after_prayer", title: "أذكار بعد الصلاة", iconKey: "prayer",
                items: [
                    { id: "p1", text: "أَسْتَغْفِرُ الله، أَسْتَغْفِرُ الله، أَسْتَغْفِرُ الله. اللّهُمَّ أَنْتَ السَّلامُ ، وَمِنْكَ السَّلام ، تَبارَكْتَ يا ذا الجَلالِ وَالإِكْرام .", count: 1 },
                    { id: "p2", text: "لا إلهَ إلاّ اللّهُ وحدَهُ لا شريكَ لهُ، لهُ المُلْكُ ولهُ الحَمْد، وهوَ على كلّ شَيءٍ قَدِير، اللّهُمَّ لا مانِعَ لِما أَعْطَيْت، وَلا مُعْطِيَ لِما مَنَعْت، وَلا يَنْفَعُ ذا الجَدِّ مِنْكَ الجَد.", count: 1 },
                    { id: "p3", text: "لا إلهَ إلاّ اللّه, وحدَهُ لا شريكَ لهُ، لهُ الملكُ ولهُ الحَمد، وهوَ على كلّ شيءٍ قدير، لا حَوْلَ وَلا قوَّةَ إِلاّ بِاللهِ، لا إلهَ إلاّ اللَّه، وَلا نَعْبُدُ إِلاّ إيّاه, لَهُ النِّعْمَةُ وَلَهُ الفَضْل وَلَهُ الثَّناءُ الحَسَن، لا إلهَ إلاّ اللّهُ مخْلِصِينَ لَهُ الدِّينَ وَلَوْ كَرِهَ الكافِرون.", count: 1 },
                    { id: "p4", text: "سُبْحَانَ اللهِ", count: 33 },
                    { id: "p5", text: "والحَمْدُ لله", count: 33 },
                    { id: "p6", text: "واللهُ أكْبَر", count: 33 },
                    { id: "p7", text: "لا إلهَ إلاّ اللّهُ وَحْدَهُ لا شريكَ لهُ، لهُ الملكُ ولهُ الحَمْد، وهُوَ على كُلّ شَيءٍ قَدِير.", count: 1 },
                    { id: "p8_1", text: "بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيمِ\nقُلْ هُوَ اللَّهُ أَحَدٌ ، اللَّهُ الصَّمَدُ ، لَمْ يَلِدْ وَلَمْ يُولَدْ ، وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ.", benefit: "تُقرأ ثلاث مرات بعد صلاتي الفجر والمغرب، ومرة بعد الصلوات الأخرى.", count: 3 },
                    { id: "p8_2", text: "بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيمِ\nقُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ، مِنْ شَرِّ مَا خَلَقَ ، وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ ، وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ، وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ.", benefit: "تُقرأ ثلاث مرات بعد صلاتي الفجر والمغرب، ومرة بعد الصلوات الأخرى.", count: 3 },
                    { id: "p8_3", text: "بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيمِ\nقُلْ أَعُوذُ بِرَبِّ النَّاسِ ، مَلِكِ النَّاسِ ، إِلَهِ النَّاسِ ، مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ، الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ، مِنَ الْجِنَّةِ وَالنَّاسِ.", benefit: "تُقرأ ثلاث مرات بعد صلاتي الفجر والمغرب، ومرة بعد الصلوات الأخرى.", count: 3 },
                    { id: "p9", text: "أَعُوذُ بِاللهِ مِنْ الشَّيْطَانِ الرَّجِيمِ\nاللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ وَلَا يَئُودُهُ حِفْظُهُمَا وَهُوَ الْعَلِيُّ الْعَظِيمُ. [آية الكرسي - البقرة 255]", benefit: "من قرأها دبر كل صلاة لم يمنعه من دخول الجنة إلا أن يموت.", count: 1 },
                    { id: "p10", text: "لا إلهَ إلاّ اللّهُ وحْدَهُ لا شريكَ لهُ، لهُ المُلكُ ولهُ الحَمْد، يُحيِي وَيُمِيتُ وهُوَ على كُلّ شيءٍ قدير.", benefit: "عَشْر مَرّات بَعْدَ المَغْرِب وَالصُّبْح.", count: 10 },
                    { id: "p11", text: "اللّهُمَّ إِنِّي أَسْأَلُكَ عِلْمـاً نافِعاً وَرِزْقاً طَيِّباً ، وَعَمَلاً مُتَقَبَّلاً.", benefit: "بَعْد السلامِ من صَلاةِ الفَجْر.", count: 1 },
                    { id: "p12", text: "اللَّهُمَّ أَجِرْنِي مِنْ النَّار.", benefit: "بعد صلاة الصبح والمغرب.", count: 7 },
                    { id: "p13", text: "اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ.", count: 1 }
                ]
            },
            {
                id: "treasures", title: "كنوز الذكر", iconKey: "treasures",
                items: [
                    { id: "t1", text: "والحمدُ للهِ تملاً الميزانَ . وسبحانَ اللهِ والحمدُ للهِ تملآنِ ما بين السماواتِ والأرضِ .", count: 1 },
                    { id: "t2", text: "سُبْحَانَ اللهِ وَبِحَمْدِهِ ، عَدَدَ خَلْقِهِ وَرِضَا نَفْسِهِ وَزِنَةَ عَرْشِهِ وَمِدَادَ كَلِمَاتِهِ", count: 3 },
                    { id: "t3", text: "كلمتانِ خفيفتانِ على اللسانِ ، ثقيلتانِ في الميزانِ حبيبتانِ إلى الرحمنِ : سُبْحَانَ اللهِ وَبِحَمْدِهِ ، سُبْحَانَ اللهِ العَظِيمِ .", count: 1 },
                    { id: "t4", text: "من قال : سُبْحَانَ اللهِ وَبِحَمْدِهِ ، في يومٍ مائةَ مرَّةٍ ، حُطَّتْ خطاياهُ وإن كانتْ مثلَ زبدِ البحرِ .", count: 100 },
                    { id: "t5", text: "لا إلهَ إلا اللهُ وحدهُ لا شريكَ لهُ ، اللهُ أكبرُ كبيراً والحمدُ للهِ كثيراً سبحانَ اللهِ ربِّ العالمينَ لا حولَ ولا قوَّةَ إلا باللهِ العزيزِ الحكيمِ.", count: 1 },
                    { id: "t6", text: "من صلَّى عليَّ واحدةً ، صلَّى اللهُ عليه عشْرًا", count: 1 },
                    { id: "t7", text: "من قال : لا إلهَ إلاَّ اللهُ وحدَهُ لا شريكَ لهُ ، لهُ المُلْكُ ولهُ الحمدُ ، وهو على كلِّ شيءٍ قديرٌ . في يومٍ مائةَ مرَّةٍ ، كانت له عدلُ عشرِ رقابٍ", count: 1 },
                    { id: "t8", text: "ألا أدُلُّكَ على كلمةٍ هي كنزٌ من كُنوزِ الجنَّةِ ؟ لا حولَ ولا قوَّةَ إلا باللهِ", count: 1 },
                    { id: "t9", text: "من قال : أشهدُ أن لا إلهَ إلاَّ اللهُ وحدَهُ لا شريكَ لهُ ، وأنَّ محمَّداً عبدُهُ ورسولُهُ...", count: 1 },
                    { id: "t10", text: "رضيتُ باللهِ ربًّا، وبالإسلامِ دينًا، وبمُحمَّدٍ رسولاً، وجَبَت لهُ الجنَّةُ .", count: 1 },
                    { id: "t11", text: "... فكلُّ تسبيحةٍ صدقةٌ . وكلُّ تحميدةٍ صدقةٌ . وكلُّ تهليلةٍ صدقةٌ . وكلُّ تكبيرةٍ صدقةٌ .", count: 1 },
                    { id: "t12", text: "أسعدُ الناسِ بشفاعتي يومَ القيامةِ ، مَن قال : لا إلهَ إلا اللهُ ، خالصًا من قلبهِ ، أو نفسه .", count: 1 },
                    { id: "t13", text: "ما اصطفى اللهُ لملائكتهِ أو لعبادهِ : سُبْحَانَ اللهِ وَبِحَمْدِهِ", count: 1 },
                    { id: "t14", text: "لأن أقولَ : سُبْحَانَ اللهِ وَالحَمْدُ للهِ وَلا إلهَ إلا اللهُ وَاللهُ أَكْبَرُ ، أحبُّ إليَّ مما طلعتْ عليهِ الشمسُ .", count: 1 },
                    { id: "t15", text: "أحبُّ الكلامِ إلى اللهِ أربعٌ : سُبْحَانَ اللهِ ، وَالحَمْدُ للهِ ، وَلا إلهَ إلا اللهُ ، وَاللهُ أكبرُ .", count: 1 },
                    { id: "t16", text: "واللهِ إني لأستغفرُ اللهَ وأتوبُ إليهِ في اليومِ أكثرَ من سبعينَ مرةً .", count: 70 },
                    { id: "t17", text: "سيد الاستغفار: اللهم أنت ربي لا إله إلا أنت خلقتني وأنا عبدك...", count: 1 },
                    { id: "t18", text: "أيعجزُ أحدُكم أن يكسبَ ، كلَّ يومٍ ، ألفَ حسنةٍ ؟ يُسبِّحُ مائةَ تسبيحةٍ", count: 100 },
                    { id: "t19", text: "لا إله إلا الله، والله أكبر، لا إله إلا الله وحده، لا إله إلا الله، ولا شريك له، لا إله إلا الله، له الملك وله الحمد، لا إله إلا الله، ولا حول ولا قوة إلا بالله", count: 1 },
                    { id: "t20", text: "من قالَ : أستَغفِرُ اللَّهَ الَّذي لا إلَهَ إلَّا هوَ الحيَّ القيُّومَ ، وأتوبُ إليهِ ، غُفِرَ لَهُ", count: 1 },
                    { id: "t21", text: "مَن قالَ : سُبحانَ اللَّهِ العظيمِ وبحمدِهِ ، غُرِست لَهُ نَخلةٌ في الجنَّةِ .", count: 1 },
                    { id: "t22", text: "إنَّ أفضلَ عبادِ اللهِ يومَ القيامةِ الحمَّادون", count: 1 },
                    { id: "t23", text: "أفضلُ الذِّكرِ: لا إلَهَ إلَّا اللَّهُ ، وأفضلُ الدُّعاءِ: الحمدُ للَّهِ .", count: 1 },
                    { id: "t24", text: "من صلَّى عليَّ واحدةً ، صلَّى اللهُ عليه عشرَ صلواتٍ", count: 1 },
                    { id: "t25", text: "إنَّ سُبْحَانَ اللَّهِ ، وَالحَمْدُ للَّهِ ، وَلا إلهَ إلَّا اللَّهُ ، وَاللَّهُ أكبرُ تنفُضُ الخطايا", count: 1 },
                    { id: "t26", text: "غِراسُ الجَنّة: لا حَوْلَ ولا قوَّةَ إلَّا باللَّهِ .", count: 1 },
                    { id: "t27", text: "أكثِروا من غرسِ الجنةِ: لا حولَ ولا قوَّةَ إلَّا باللهِ .", count: 1 },
                    { id: "t28", text: "[تاج الذكر]: لا إله إلا الله وحده لا شريك له ، له الملكُ وله الحمدُ ، وهو على كلِّ شيءٍ قديرٌ.", count: 1 },
                    { id: "t29", text: "[تاج التسبيح]: سُبْحَانَ اللهِ وَبِحَمْدِهِ عَدَدَ خَلْقِهِ وَرِضَا نَفْسِهِ وَزِنَةَ عَرْشِهِ وَمِدَادَ كَلِمَاتِهِ.", count: 1 },
                    { id: "t30", text: "[تاج الدعاء]: ربنا آتنا في الدنيا حسنة وفي الآخرة حسنة وقنا عذاب النار.", count: 1 },
                    { id: "t31", text: "[تاج التحصين]: بسم الله الذي لا يضر مع اسمه شيء في الأرض ولا في السماء وهو السميع العليم.", count: 1 },
                    { id: "t32", text: "[تاج الاستغفار]: اللهم أنت ربي لا إله إلا أنت خلقتني وأنا عبدك...", count: 1 }
                ]
            }
        ];

        var currentSection = null;
        var activeIndex = 0;
        var activeZikrCount = 0;
        var progressData = safeGetStorage('azkar_user_progress', {});

        function initDashboard() {
            try {
                var grid = document.getElementById('sections-grid');
                if (!grid) return;
                grid.innerHTML = '';
                
                var r = 12;
                var circum = 2 * Math.PI * r;

                for (var i = 0; i < azkarData.length; i++) {
                    var section = azkarData[i];
                    var totalItems = section.items.length;
                    var savedIndex = (progressData[section.id] && progressData[section.id].currentIndex) || 0;
                    var isFinished = (progressData[section.id] && progressData[section.id].finished) || false;
                    
                    var percent = Math.round((savedIndex / totalItems) * 100);
                    if (isFinished) percent = 100;
                    if (percent > 100) percent = 100;

                    var offset = circum - (percent / 100) * circum;
                    var btnLabel = percent === 100 ? 'إعادة' : (savedIndex > 0 ? 'متابعة' : 'ابدأ');

                    var card = document.createElement('div');
                    card.className = "card";
                    card.setAttribute('onclick', "startSection('" + section.id + "')");

                    card.innerHTML = 
                        '<div class="card-right">' +
                            '<div class="card-icon">' + (iconsMap[section.iconKey] || '') + '</div>' +
                            '<div>' +
                                '<div class="card-title">' + section.title + '</div>' +
                                '<div class="card-desc">' + savedIndex + ' من أصل ' + totalItems + ' ذكر (%' + percent + ')</div>' +
                            '</div>' +
                        '</div>' +
                        '<div class="card-left">' +
                            '<svg class="progress-ring-svg">' +
                                '<circle class="progress-ring-circle-bg" cx="16" cy="16" r="' + r + '"/>' +
                                '<circle class="progress-ring-circle" cx="16" cy="16" r="' + r + '" stroke-dasharray="' + circum + '" stroke-dashoffset="' + offset + '"/>' +
                            '</svg>' +
                            '<button class="btn-action">' + btnLabel + '</button>' +
                        '</div>';

                    grid.appendChild(card);
                }
            } catch (e) {}
        }

        function startSection(sectionId) {
            try {
                currentSection = null;
                for (var i = 0; i < azkarData.length; i++) {
                    if (azkarData[i].id === sectionId) {
                        currentSection = azkarData[i];
                        break;
                    }
                }
                if (!currentSection) return;

                if (!progressData[sectionId]) {
                    progressData[sectionId] = { currentIndex: 0, currentZikrCount: 0, finished: false };
                }
                if (progressData[sectionId].finished) {
                    progressData[sectionId].currentIndex = 0;
                    progressData[sectionId].currentZikrCount = 0;
                    progressData[sectionId].finished = false;
                }

                activeIndex = progressData[sectionId].currentIndex || 0;
                activeZikrCount = progressData[sectionId].currentZikrCount || 0;

                document.getElementById('dashboard-view').classList.add('hidden');
                document.getElementById('completion-view').classList.add('hidden');
                document.getElementById('zikr-view').classList.remove('hidden');
                
                renderZikr();
            } catch (e) {}
        }

        function renderZikr() {
            try {
                if (!currentSection || !currentSection.items) return;
                if (activeIndex >= currentSection.items.length) {
                    finishSection();
                    return;
                }

                var currentZikr = currentSection.items[activeIndex];
                document.getElementById('zikr-text').innerText = currentZikr.text;
                
                var benefitBox = document.getElementById('zikr-benefit');
                if (currentZikr.benefit) {
                    benefitBox.innerText = currentZikr.benefit;
                    benefitBox.classList.remove('hidden');
                } else {
                    benefitBox.classList.add('hidden');
                }

                var total = currentSection.items.length;
                document.getElementById('progress-text').innerText = activeIndex + ' / ' + total + ' ذكر';
                var barPercent = Math.round((activeIndex / total) * 100);
                document.getElementById('progress-bar').style.width = barPercent + '%';

                document.getElementById('counter-current').innerText = activeZikrCount;
                document.getElementById('counter-target').innerText = currentZikr.count;
            } catch (e) {}
        }

        function incrementCounter() {
            try {
                if (!currentSection || !currentSection.items) return;
                var currentZikr = currentSection.items[activeIndex];
                if (activeZikrCount < currentZikr.count) {
                    activeZikrCount++;
                    document.getElementById('counter-current').innerText = activeZikrCount;
                    saveProgress();

                    if (navigator.vibrate) navigator.vibrate(15);

                    if (activeZikrCount === currentZikr.count) {
                        setTimeout(function() {
                            activeIndex++;
                            activeZikrCount = 0;
                            saveProgress();
                            renderZikr();
                        }, 350);
                    }
                }
            } catch (e) {}
        }

        function nextZikrManual() {
            try {
                activeIndex++;
                activeZikrCount = 0;
                saveProgress();
                renderZikr();
            } catch (e) {}
        }

        function resetCurrentCount() {
            try {
                activeZikrCount = 0;
                saveProgress();
                renderZikr();
            } catch (e) {}
        }

        function finishSection() {
            try {
                if (!currentSection) return;
                progressData[currentSection.id].finished = true;
                safeSetStorage('azkar_user_progress', progressData);

                document.getElementById('zikr-view').classList.add('hidden');
                document.getElementById('completion-view').classList.remove('hidden');
            } catch (e) {}
        }

        function saveProgress() {
            try {
                if (!currentSection) return;
                progressData[currentSection.id] = {
                    currentIndex: activeIndex,
                    currentZikrCount: activeZikrCount,
                    finished: false
                };
                safeSetStorage('azkar_user_progress', progressData);
            } catch (e) {}
        }

        function triggerResetSection() {
            document.getElementById('reset-modal').classList.remove('hidden');
        }
        function closeResetModal() {
            document.getElementById('reset-modal').classList.add('hidden');
        }
        function confirmResetSection() {
            activeZikrCount = 0;
            activeIndex = 0;
            saveProgress();
            closeResetModal();
            renderZikr();
        }

        function showDashboard() {
            document.getElementById('zikr-view').classList.add('hidden');
            document.getElementById('completion-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.remove('hidden');
            initDashboard();
        }

        function toggleTheme() {
            try {
                var isDark = document.documentElement.classList.toggle('dark');
                safeSetStorage('azkar_dark_mode', isDark);
                updateThemeIcon(isDark);
            } catch (e) {}
        }

        function updateThemeIcon(isDark) {
            var icon = document.getElementById('theme-icon');
            if (icon) {
                if (isDark) {
                    icon.innerHTML = '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>';
                } else {
                    icon.innerHTML = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>';
                }
            }
        }

        var savedDarkMode = safeGetStorage('azkar_dark_mode', true);
        if (savedDarkMode) {
            document.documentElement.classList.add('dark');
            updateThemeIcon(true);
        } else {
            document.documentElement.classList.remove('dark');
            updateThemeIcon(false);
        }

        initDashboard();
    </script>
</body>
</html>
